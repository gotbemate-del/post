<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<title>新增家數 — 澎湖店家確認表單</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➕</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <div class="topbar__title">
      <h1>新增家數</h1>
      <p class="topbar__sub">原始名單以外新加的店家 · 依街道分區</p>
    </div>
    <div class="conn" id="conn" data-state="connecting">
      <span class="conn__dot"></span><span class="conn__label">連線中</span>
    </div>
  </div>

  <nav class="pagenav">
    <a href="/">← 回原始名單</a>
    <form method="post" action="/logout" class="pagenav__logout"><button type="submit">登出</button></form>
  </nav>

  <div class="stats" id="stats">
    <div class="stat"><span class="stat__num" id="statTotal">–</span><span class="stat__label">新增總數</span></div>
    <div class="stat"><span class="stat__num" id="statSent">–</span><span class="stat__label">已發送</span></div>
    <div class="stat"><span class="stat__num" id="statPosted">–</span><span class="stat__label">已張貼</span></div>
    <div class="stat"><span class="stat__num" id="statUnsent">–</span><span class="stat__label">未發送</span></div>
    <div class="stat"><span class="stat__num" id="statStreets">–</span><span class="stat__label">街道／地區</span></div>
  </div>
</header>

<section class="addbox">
  <h2 class="addbox__title">新增一家店</h2>
  <form id="addForm" class="addbox__form" autocomplete="off">
    <label class="field field--wide">
      <span>店家名稱 <b>*</b></span>
      <input type="text" name="name" required maxlength="200" placeholder="例：阿婆的店">
    </label>
    <label class="field">
      <span>鄉鎮市</span>
      <input type="text" name="town" list="townList" maxlength="40" placeholder="馬公市">
    </label>
    <label class="field">
      <span>街道／地區</span>
      <input type="text" name="street" list="streetList" maxlength="60" placeholder="三多路">
    </label>
    <label class="field field--wide">
      <span>地址</span>
      <input type="text" name="address" maxlength="500" placeholder="880澎湖縣馬公市…">
    </label>
    <label class="field">
      <span>電話</span>
      <input type="tel" name="phone" maxlength="60" placeholder="06-9271234">
    </label>
    <label class="field">
      <span>發送狀態</span>
      <select name="status" id="addStatus"></select>
    </label>
    <div class="addbox__actions">
      <button type="submit" class="btn btn--primary" id="addBtn">新增</button>
      <span class="addbox__hint">街道可以直接打新的，不限於原始名單的 92 條。</span>
    </div>
  </form>
  <datalist id="townList"></datalist>
  <datalist id="streetList"></datalist>
</section>

<main id="main" class="main">
  <p class="placeholder" id="placeholder">載入中…</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

<script src="session.js"></script>
<script src="photo.js"></script>
<script src="new.js"></script>
</body>
</html>
