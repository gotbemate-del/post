# Render Blueprint — 澎湖店家確認表單
#
# 資料存在 Postgres（DATABASE_URL），不是 Render 的檔案系統 ——
# free 方案的檔案系統是暫時的，重啟就清空，但資料庫不受影響。
#
# ⚠️ 目前共用 yong-jing-db（Render 免費方案每個帳號只能有一個資料庫），
#    表放在獨立的 penghu schema 裡，不會跟另一個專案撞名。
#    該資料庫 2026-08-29 到期，到期前要升級付費方案，否則兩個專案的資料一起消失。
services:
  - type: web
    name: penghu-store-confirmation
    runtime: node
    plan: free
    region: singapore        # 要和資料庫同區，內部連線才走得通
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Postgres 連線字串。用「內部」連線位址（同區域免費、不繞外網）。
      # 沒設的話資料只寫本機檔案，重啟就消失。
      - key: DATABASE_URL
        sync: false
      # 資料表放哪個 schema，預設 penghu
      - key: PG_SCHEMA
        value: penghu

      # 密碼保護。沒設就是任何人拿到網址都能開。
      - key: APP_PASSWORD
        sync: false
