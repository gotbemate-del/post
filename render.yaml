# Render Blueprint — 澎湖店家確認表單
#
# 目前設定為 free 方案，沒有掛 Persistent Disk。
#
# ⚠️ 填寫的聯繫狀態存在專案內的 data/status.json，free 方案的檔案系統是暫時的，
#    服務休眠重啟或重新部署後，所有人填的紀錄都會歸零、退回 Excel 的初始狀態。
#
# 要長期保留紀錄，改成 starter 以上並掛磁碟（free 不支援 Persistent Disk）：
#   plan: starter
#   envVars:  加一組 DATA_DIR = /var/data
#   disk:     name: store-status / mountPath: /var/data / sizeGB: 1
services:
  - type: web
    name: penghu-store-confirmation
    runtime: node
    plan: free
    region: singapore        # 離台灣最近的 Render 區域
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
